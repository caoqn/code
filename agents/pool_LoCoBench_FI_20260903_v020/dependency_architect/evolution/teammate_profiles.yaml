reviewer:
  communication_style: Detailed but focused review notes, often iterative.
  notes:
  - Useful for catching integration and contract mismatches before finalization.
  reliability: high
  strengths:
  - Provides concrete, code-level review findings and identifies compatibility risks.
  - Communicates clearly with prioritized corrections.
  weaknesses:
  - May issue several incremental review updates as implementation evolves.
solution_verifier:
  communication_style: Concise, evidence-based status reports.
  notes:
  - Best leveraged with an early verification pass and explicit scope.
  reliability: high
  strengths:
  - Performs targeted static verification and reports concrete failures or confidence
    signals.
  - Checks package integration and required output completeness.
  weaknesses:
  - Verification feedback can arrive late if implementation continues iterating.
