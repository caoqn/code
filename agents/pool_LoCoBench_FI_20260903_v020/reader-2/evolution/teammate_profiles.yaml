developer:
  communication_style: Concise implementation updates with targeted requests for concrete
    interface or verification feedback.
  notes:
  - Works effectively with detailed code excerpts and explicit acceptance criteria.
  - Works most effectively when readers provide complete, code-grounded reports early.
  - A fixed verification checklist helps limit late integration churn.
  - Works best from a prioritized implementation contract, canonical entrypoint identification,
    and fixed final verification checklist.
  - Benefits from early consolidated code-reading reports that include exact interfaces
    and integration risks.
  - Performs best with an early prioritized acceptance checklist, canonical runtime
    path, and fixed implementation cutoff followed by one final verification pass.
  reliability: high
  strengths:
  - Integrates cross-cutting changes across configuration, middleware, repositories,
    and application wiring.
  - Actively incorporates review and verification feedback into implementation.
  - Integrates source-level findings into coherent cross-module implementations quickly.
  - Responds well to concrete interface excerpts and targeted review feedback.
  - Coordinates implementation across routing, services, persistence, and documentation
    layers.
  - Integrates repository evidence into coherent cross-module implementations quickly.
  - Translates concrete interfaces into code and responds constructively to verification
    feedback.
  - Coordinates effectively across routing, configuration, middleware, persistence,
    and API wiring.
  - Integrates cross-module repository evidence into coherent implementations quickly.
  - Handles routing, schemas, services, configuration, persistence, and documentation
    wiring competently.
  - Responds constructively to concrete review and verification feedback.
  - Performs syntax and artifact-cleanup checks near completion.
  weaknesses:
  - Coordination can become message-heavy with repeated incremental status updates
    under tight time budgets.
  - Can spend too long iterating when many review inputs arrive under a hard deadline.
  - Benefits from a clearly prioritized minimum viable scope and consolidated feedback.
  - Can iterate too long when requirements span multiple architectural layers or when
    many incremental review inputs arrive.
  - May initially overlook exact response-schema fields or canonical duplicate entrypoints
    without an explicit checklist.
  - Broad tasks with duplicate entrypoints can lead to initially targeting a non-canonical
    path or overlooking exact contract fields.
  - Iterative coordination and late feedback can consume substantial time.
planner:
  communication_style: Structured delegation with concise follow-up requests and emphasis
    on direct reporting.
  notes:
  - Effective when assignments specify exact files, interfaces, and verification criteria.
  - Strong at maintaining end-to-end scope across multiple microservices and duplicate
    entrypoints.
  reliability: high
  strengths:
  - Decomposes broad repository tasks into focused, non-overlapping analysis assignments.
  - Coordinates specialists and routes findings to the implementation owner.
  - Tracks canonical integration surfaces and requirement coverage.
  weaknesses:
  - Coordination can become message-heavy when requirements span many services.
  - Benefits from early consolidated reports to reduce repeated clarification cycles.
reviewer:
  communication_style: Concise, issue-focused review messages.
  notes:
  - Most effective in a single final pass against a fixed checklist.
  reliability: high
  strengths:
  - Checks implementations against interfaces, invariants, and task requirements.
  - Finds blocking correctness and compatibility issues with concrete fixes.
  - Communicates clearly with prioritized, issue-focused findings.
  weaknesses:
  - Repeated review rounds can consume substantial time under strict budgets.
solution_verifier:
  communication_style: Brief, actionable validation reports.
  notes:
  - Strong final quality gate when canonical integration paths and exact acceptance
    contracts are specified.
  reliability: high
  strengths:
  - Independently verifies artifact placement, syntax, route wiring, exact contracts,
    and requirement coverage.
  - Performs concise static consistency checks and catches packaging artifacts or
    subtle mismatches.
  - Clearly distinguishes blocking defects from non-blocking caveats.
  weaknesses:
  - Repeated late verification rounds consume time; feedback is strongest with a fixed
    checklist near finalization.
