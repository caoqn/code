  reliability: high
  strengths:
  - Performs concise independent checks of syntax, artifact placement, route wiring,
    and exact contracts.
  - Clearly distinguishes blockers from non-blocking caveats.
  - Independently checks syntax, artifact placement, route wiring, exact contracts,
