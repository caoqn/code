researcher:
  communication_style: detailed and transparent
  notes:
  - Particularly useful for multi-document intersection questions involving indirect
    clues and entity normalization.
  - For multi-hop database questions, require explicit evidence for each semantic
    operation (filter, transformation branch, co-occurrence intersection, weight ranking).
  - Strong for versioned hyperlink-graph questions when asked to anchor every edge
    to a historical revision and test minimality.
  - Strong at independent puzzle solving and correcting interpretations when contradictory
    evidence appears.
  - For averages over identified people, verify whether identification is explicit
    in file or discoverable on open pages; benchmark may expect all named persons
    with externally resolved profiles.
  - For GitHub historical-label questions, ask for both candidate enumeration and
    direct LabeledEvent evidence, including renamed labels and exact timestamps.
  - Effective for attachment-based document/table cross-analysis; independently enumerates
    rows and validates the exact-one-missing count.
  - For historical Wikipedia questions, explicitly distinguish promotion date from
    main-page or publication dates and quote the nomination header verbatim.
  - For repository tasks, needs provided excerpts or direct workspace access to produce
    actionable schema evidence.
  - For book-chapter questions, direct downloadable full-text retrieval and local
    extraction are more decisive than relying on search snippets alone.
  - Clearly flags ambiguity when the question's wording could refer to multiple authors
    or identities.
  - Should be explicitly tasked to extract the exact provider series, adjustment mode,
    metric (high/close), and complete date range before relying on secondary sources.
  - Useful for independent reconciliation when service APIs lack populated records;
    benefits from bounded requests for concise evidence.
  - For unstable external data questions, provide early bounded findings and clearly
    separate current live totals from requested historical values.
  - For source questions with multiple materials, report a ranked interpretation tied
    to title, abstract, and grammatical focus, not just every explicit material.
  - Effective for targeted historical documentation lookups when asked for exact source
    evidence.
  - Effective for historical transit schedule lookups when asked to quote exact station
    rows and endpoint exclusions.
  - For strict title-translation questions, should state one preferred translation
    early, then list alternatives only as bounded caveats.
